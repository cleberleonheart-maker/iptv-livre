<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>IPTV Livre</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css?v=2026.10.09-3">
</head>
<body>

<div id="login" class="login-screen">
  <form id="loginForm" class="login-box" autocomplete="on">
    <div class="login-logo">📺</div>
    <h1>IPTV Livre</h1>
    <p class="login-sub">Entre com seu usuario e senha</p>
    <input id="loginUser" type="text" placeholder="Usuario" autocomplete="username" required>
    <input id="loginPass" type="password" placeholder="Senha" autocomplete="current-password" required>
    <button id="btnLogin" type="submit">Entrar</button>
    <small id="loginMsg" class="msg"></small>
    <small id="buildTag" class="build-tag"></small>
  </form>
</div>

<div id="app" hidden>
<header id="topbar">
  <button id="btnMenu" class="icon-btn" aria-label="Menu">☰</button>
  <div class="brand">
    <span class="logo-tv">📺</span>
    <div>
      <h1>IPTV Livre</h1>
      <small id="statsLine">carregando…</small>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Buscar canal…" autocomplete="off" spellcheck="false">
    <button id="btnSearch" class="icon-btn" aria-label="Buscar">🔍</button>
    <button id="btnEpgSearch" class="icon-btn" aria-label="Buscar na programação">📅</button>
  </div>
  <nav class="quick">
    <button class="chip active" data-tab="tv">TV</button>
    <button class="chip" data-tab="radio">Rádio</button>
    <button class="chip" data-tab="br">Brasil</button>
    <button class="chip" data-tab="fav">Favoritos</button>
    <button class="chip" data-tab="recent">Recentes</button>
    <button class="chip" id="btnEpg">Guia EPG</button>
    <button class="chip" id="btnNow">Agora</button>
    <button class="chip" id="btnImport">Importar M3U</button>
    <button class="chip" id="btnExport">Exportar M3U</button>
    <button class="chip" id="btnRecheck">Re-verificar</button>
    <button class="chip" id="btnAccount">Conta</button>
    <button class="chip" id="btnLogout">Sair</button>
  </nav>
</header>

<aside id="sidebar">
  <div class="side-sec">
    <h3>País</h3>
    <div id="countryList" class="side-list"></div>
  </div>
  <div class="side-sec">
    <h3>Categoria</h3>
    <div id="categoryList" class="side-list"></div>
  </div>
</aside>

<main id="content">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>Nenhum canal encontrado.</p>
    <small>Tente outra busca ou outro filtro.</small>
  </div>
  <div id="loadMoreWrap" class="load-more-wrap"><button id="btnMore">Carregar mais</button></div>
</main>

<div id="player" class="player" hidden>
  <video id="video" playsinline autoplay controls x-webkit-airplay="allow"></video>
  <div id="radioArt" class="radio-art" aria-hidden="true" hidden></div>
  <div id="plLive" class="pl-live" hidden>AO VIVO · RÁDIO</div>
  <div class="pl-top">
    <button id="btnBack" class="icon-btn big">✕</button>
    <div class="pl-title">
      <strong id="plName">—</strong>
      <small id="plMeta">—</small>
    </div>
    <button id="btnQual" class="icon-btn big" aria-label="Qualidade" hidden>⚙</button>
    <button id="btnCC" class="icon-btn big" aria-label="Legendas" hidden>CC</button>
    <button id="btnCast" class="icon-btn big" aria-label="Transmitir para a TV" hidden>⧉</button>
    <button id="btnSleep" class="icon-btn big" aria-label="Timer de sono">⏱ off</button>
    <button id="btnFav" class="icon-btn big" aria-label="Favoritar">☆</button>
  </div>
  <div id="plStatus" class="pl-status" hidden>carregando…</div>
  <div id="plEpg" class="pl-epg"></div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="panel" class="panel" hidden>
  <div class="panel-box">
    <div class="panel-head">
      <h2>Minha conta</h2>
      <button id="panelClose" class="icon-btn big" aria-label="Fechar">✕</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
  </div>
</div>

<div id="dlg" class="dlg" hidden>
  <div class="dlg-box">
    <h3 id="dlgTitle">Importar M3U</h3>
    <p id="dlgHelp"></p>
    <input id="dlgInput" type="text" autocomplete="off" spellcheck="false">
    <div id="dlgChoices" class="dlg-choices" hidden></div>
    <div class="dlg-actions">
      <button id="dlgCancel">Cancelar</button>
      <button id="dlgOk">OK</button>
    </div>
  </div>
</div>

<div id="parDlg" class="dlg" hidden>
  <div class="dlg-box">
    <h3>Controle parental</h3>
    <p id="parHelp"></p>
    <input id="parPin" type="password" autocomplete="new-password" placeholder="PIN (4+ dígitos)">
    <input id="parPin2" type="password" autocomplete="new-password" placeholder="Repita o PIN" style="margin-top:8px">
    <div id="parCats" class="dlg-choices chk-list"></div>
    <div class="dlg-actions">
      <button id="parCancel">Cancelar</button>
      <button id="parOk">Salvar</button>
    </div>
  </div>
</div>
</div><!-- /#app -->

<script src="/vendor/hls.min.js"></script>
<script src="/js/player.js?v=2026.10.09-3"></script>
<script src="/js/login.js?v=2026.10.09-3"></script>
<script src="/js/app.js?v=2026.10.09-3"></script>
</body>
</html>
